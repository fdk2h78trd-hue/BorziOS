<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorziOS</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot">
    <div class="logo">BorziOS</div>
    <div class="loader"></div>
    <p>Запуск системы...</p>
</div>

<div id="desktop">

    <div class="wallpaper"></div>

    <div class="icons">

        <div class="icon">
            📁
            <span>Файлы</span>
        </div>

        <div class="icon">
            ⚙️
            <span>Настройки</span>
        </div>

    </div>

    <div id="taskbar">

        <div id="start">
            B
        </div>

        <div id="clock">
            00:00
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
